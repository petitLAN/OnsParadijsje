<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="page">
    <section class="hero" id="hero">
      <span class="tag blue" id="heroLabel"></span>
      <h1 id="siteTitle"></h1>
      <p id="siteSubtitle"></p>
      <p><strong id="siteGreeting"></strong></p>
      <p class="small" id="siteHelper"></p>
    </section>

    <section class="grid" id="dashboard" aria-live="polite"></section>

    <section class="toolbar bottom-toolbar" id="toolbar" aria-label="Dashboard tools">
      <button id="editorToggle" type="button"></button>
      <button id="resetLayout" type="button"></button>
      <button id="downloadConfig" type="button"></button>
      <button id="copyConfig" type="button"></button>
      <span class="toolbar-note" id="toolbarNote"></span>
    </section>

    <section class="layout-editor bottom-layout-editor" id="layoutEditor" hidden>
      <div class="editor-panel">
        <h2 id="editorTitle"></h2>
        <p id="editorDescription"></p>
        <div id="frameList" class="frame-list"></div>
        <div class="add-row">
          <select id="newFrameType" aria-label="Frame type to add"></select>
          <button id="addFrame" type="button"></button>
        </div>
      </div>
      <div class="editor-panel">
        <h2 id="howTitle"></h2>
        <ol class="clean" id="howList"></ol>
      </div>
    </section>

    <footer class="site-footer" aria-label="Footer">
      <span class="footer-logo" aria-hidden="true"></span>
      <p class="footer-note" id="footerNote"></p>
    </footer>
  </main>

  <template id="cardTemplate"></template>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
